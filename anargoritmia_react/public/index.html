<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141210" />
    <meta
      name="description"
      content="Anargoritmia: biblioteca algorítmica digital de la Licenciatura en Matemática Algorítmica, en español y bajo CC BY-SA 4.0."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Tema claro/oscuro antes del primer pintado (evita el parpadeo).
      Usa la elección guardada en este navegador o, si no hay, la preferencia
      del sistema. La elección vive solo en localStorage; nada va al servidor.
      Debe coincidir con src/utils/tema.js.
    -->
    <script>
      (function () {
        var tema;
        try {
          tema = localStorage.getItem("anargoritmia-tema");
        } catch (e) {}
        if (tema !== "claro" && tema !== "oscuro") {
          tema =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "oscuro"
              : "claro";
        }
        document.documentElement.setAttribute("data-theme", tema);
      })();
    </script>
    <title>Anargoritmia</title>
  </head>
  <body>
    <noscript>Anargoritmia necesita JavaScript para funcionar.</noscript>
    <div id="root"></div>
  </body>
</html>
